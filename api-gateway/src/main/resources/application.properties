spring.application.name=api-gateway
server.port=${GATEWAY_PORT:8080}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.enabled=true
eureka.instance.prefer-ip-address=true
# AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**,/api/usuarios/**,/api/roles/**
# TECNICO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].id=tecnico-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://TECNICO-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/tecnicos/**,/api/especialidades/**
# TICKET-SERVICE
spring.cloud.gateway.server.webflux.routes[2].id=ticket-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://TICKET-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/tickets/**,/api/categorias/**,/api/prioridades/**,/api/estados-ticket/**
app.cors.allowed-origins=http://localhost:4200,http://localhost:4201

# Identidad del servidor de configuracion
spring.application.name=ticket-config-server
server.port=8888
# El Config Server se conecta a GitHub, NO consulta a otro Config Server
spring.cloud.config.server.git.uri=https://github.com/MarcoPoloDev/config-repo-ticket.git
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true
# Registro en Eureka (Eureka debe iniciar primero)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=false
